# ===========================
# Server
# ===========================
server.port=8080
server.shutdown=graceful

# ===========================
# PostgreSQL DataSource
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/whiteboard_db
spring.datasource.username=whiteboard_user
spring.datasource.password=whiteboard_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are good, but let's be explicit)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Async thread pool (for @Async persistence)
# ===========================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
