# ===========================
# Server
# ===========================
server.port=${PORT:8080}
server.shutdown=graceful

# ===========================
# PostgreSQL DataSource
# ===========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/whiteboard_db}
spring.datasource.username=${DATABASE_USERNAME:whiteboard_user}
spring.datasource.password=${DATABASE_PASSWORD:whiteboard_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# Keep retrying DB connection instead of crashing on startup
spring.datasource.hikari.initialization-fail-timeout=-1

# Defer datasource init so app binds to port first, then connects to DB
spring.jpa.defer-datasource-initialization=true

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Async thread pool (for @Async persistence)
# ===========================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
