# ===========================
# Server
# ===========================
server.port=${PORT:8080}
server.shutdown=graceful

# ===========================
# PostgreSQL DataSource
# ===========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/whiteboard_db}
spring.datasource.username=${DATABASE_USERNAME:whiteboard_user}
spring.datasource.password=${DATABASE_PASSWORD:whiteboard_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are good, but let's be explicit)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.NonValidatingFactory

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Async thread pool (for @Async persistence)
# ===========================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
